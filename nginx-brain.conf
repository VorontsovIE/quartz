server {
    listen 80;
    server_name brain.vorontsovie.xyz;
    root /srv/brain/public;
    index index.html;
    error_page 404 /404.html;
    
    charset utf-8;
 
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# Private site: Basic-Auth protected. Serves the private overlay
# (/srv/brain/private) first and falls back to the public output
# (/srv/brain/public) for everything it does not contain, so public pages
# and shared static resources are stored once.
server {
    listen 80;
    server_name hindbrain.vorontsovie.xyz;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd-hindbrain;

    add_header X-Robots-Tag "noindex, nofollow" always;

    root /srv/brain/private;
    index index.html;
    error_page 404 /404.html;
    # A directory that exists in the overlay but has no index there
    # (mixed public/private folders) must fall through to the public copy.
    error_page 403 @public;

    charset utf-8;

    location / {
        try_files $uri $uri.html $uri/index.html @public;
    }

    location @public {
        root /srv/brain/public;
        try_files $uri $uri.html $uri/ =404;
    }
}
